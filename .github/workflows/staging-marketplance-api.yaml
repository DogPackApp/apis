name: Marketplace-API-DEV Pipeline

on:
  push:
    branches:
      - features/aws-dev-restructuring
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: [gh-marketplace-api-dev]
    environment: development
    timeout-minutes: 45

    env:
      AWS_REGION: us-east-2
      CODEDEPLOY_APPLICATION: dogpack-dev-use2-marketplace-api
      CODEDEPLOY_DEPLOYMENT_GROUP: dogpack-dev-use2-marketplace-api-dg
      ARTIFACT_PREFIX: code-deploy/marketplace-api

    steps:

      # ============================================================
      # 1. Checkout code
      # ============================================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================================
      # 2. Restore Laravel Passport keys for testing
      # ============================================================
      - name: Restore Passport OAuth keys
        env:
          PASSPORT_PRIVATE_KEY: ${{ secrets.PASSPORT_PRIVATE_KEY }}
          PASSPORT_PUBLIC_KEY: ${{ secrets.PASSPORT_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          test -n "$PASSPORT_PRIVATE_KEY" || {
            echo "ERROR: PASSPORT_PRIVATE_KEY is missing"
            exit 1
          }

          test -n "$PASSPORT_PUBLIC_KEY" || {
            echo "ERROR: PASSPORT_PUBLIC_KEY is missing"
            exit 1
          }

          mkdir -p storage

          printf '%s\n' "$PASSPORT_PRIVATE_KEY" \
            > storage/oauth-private.key

          printf '%s\n' "$PASSPORT_PUBLIC_KEY" \
            > storage/oauth-public.key

          chmod 600 storage/oauth-private.key
          chmod 600 storage/oauth-public.key

          test -s storage/oauth-private.key
          test -s storage/oauth-public.key

          echo "Passport keys restored"

      # ============================================================
      # 3. Create .env from ENV_DEV JSON secret
      # ============================================================
      - name: Create .env file
        env:
          ENV_JSON: ${{ secrets.ENV_DEV }}
        run: |
          set -euo pipefail

          test -n "$ENV_JSON" || {
            echo "ERROR: ENV_DEV secret is empty"
            exit 1
          }

          printf '%s' "$ENV_JSON" > "$RUNNER_TEMP/env-dev.json"

          jq -e 'type == "object"' \
            "$RUNNER_TEMP/env-dev.json" > /dev/null

          jq -r '
            to_entries[]
            | "\(.key)=\"\(
                (.value | tostring)
                | gsub("\\\\"; "\\\\\\\\")
                | gsub("\""; "\\\"")
                | gsub("\r"; "\\r")
                | gsub("\n"; "\\n")
              )\""
          ' "$RUNNER_TEMP/env-dev.json" > .env

          rm -f "$RUNNER_TEMP/env-dev.json"
          chmod 600 .env

          test -s .env

          echo ".env created successfully"

      # ============================================================
      # 4. Install Composer dependencies for tests
      # ============================================================
      - name: Install Composer dependencies
        run: |
          set -euo pipefail

          composer validate --no-check-publish

          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress

      # ============================================================
      # 5. Clear Laravel caches
      # ============================================================
      - name: Clear Laravel caches
        run: |
          set -euo pipefail

          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

      # ============================================================
      # 6. Verify Laravel environment and Passport keys
      # ============================================================
      - name: Verify Laravel environment
        run: |
          set -euo pipefail

          php artisan --version

          test -s .env
          test -s storage/oauth-private.key
          test -s storage/oauth-public.key

          echo "Laravel environment verified"

      # ============================================================
      # 7. Run tests
      # ============================================================
      - name: Run tests
        run: |
          set -euo pipefail

          composer test

      # ============================================================
      # 8. Verify AWS identity and configuration
      # ============================================================
      - name: Verify AWS access
        env:
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail

          aws sts get-caller-identity \
            --region "$AWS_REGION"

          aws configure get region || true

          echo "AWS identity verified"

      # ============================================================
      # 9. Generate unique artifact name
      # ============================================================
      - name: Generate artifact name
        id: artifact_name
        run: |
          set -euo pipefail

          TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          COMMIT_SHA_SHORT=$(git rev-parse --short HEAD)

          UNIQUE_NAME="artifact_${TIMESTAMP}_${COMMIT_SHA_SHORT}"

          echo "unique_name=$UNIQUE_NAME" >> "$GITHUB_OUTPUT"

          echo "Artifact name: $UNIQUE_NAME"

      # ============================================================
      # 10. Download CodeDeploy files from DEV S3 bucket
      # ============================================================
      - name: Download CodeDeploy files
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_DEV }}
        run: |
          set -euo pipefail

          test -n "$S3_BUCKET" || {
            echo "ERROR: S3_BUCKET_DEV secret is missing"
            exit 1
          }

          mkdir -p deploy

          aws s3 cp \
            "s3://${S3_BUCKET}/code-deploy/marketplace-api/appspec.yml" \
            deploy/appspec.yml \
            --region "$AWS_REGION"

          aws s3 cp \
            "s3://${S3_BUCKET}/code-deploy/marketplace-api/beforeInstall" \
            deploy/beforeInstall \
            --region "$AWS_REGION"

          aws s3 cp \
            "s3://${S3_BUCKET}/code-deploy/marketplace-api/applicationStart" \
            deploy/applicationStart \
            --region "$AWS_REGION"

          test -s deploy/appspec.yml
          test -s deploy/beforeInstall
          test -s deploy/applicationStart

          chmod +x \
            deploy/beforeInstall \
            deploy/applicationStart

          echo "CodeDeploy files downloaded successfully"

      # ============================================================
      # 11. Prepare a clean deployment package
      # ============================================================
      - name: Prepare deployment package
        env:
          ARTIFACT_NAME: ${{ steps.artifact_name.outputs.unique_name }}
        run: |
          set -euo pipefail

          PACKAGE_DIR="$RUNNER_TEMP/marketplace-api-package"
          ARTIFACT_PATH="$GITHUB_WORKSPACE/${ARTIFACT_NAME}.zip"

          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"

          # Copy application source without GitHub or local dependencies.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='vendor/' \
            --exclude='deploy/' \
            --exclude='storage/oauth-private.key' \
            --exclude='storage/oauth-public.key' \
            --exclude='storage/logs/*' \
            --exclude='bootstrap/cache/*.php' \
            ./ "$PACKAGE_DIR/"

          # Include CodeDeploy configuration and lifecycle scripts.
          cp deploy/appspec.yml "$PACKAGE_DIR/appspec.yml"
          cp deploy/beforeInstall "$PACKAGE_DIR/beforeInstall"
          cp deploy/applicationStart "$PACKAGE_DIR/applicationStart"

          chmod +x \
            "$PACKAGE_DIR/beforeInstall" \
            "$PACKAGE_DIR/applicationStart"

          # Never include .env or Passport private keys.
          test ! -e "$PACKAGE_DIR/.env"
          test ! -e "$PACKAGE_DIR/storage/oauth-private.key"
          test ! -e "$PACKAGE_DIR/storage/oauth-public.key"

          # Verify the expected application files.
          test -s "$PACKAGE_DIR/composer.json"
          test -s "$PACKAGE_DIR/composer.lock"
          test -s "$PACKAGE_DIR/appspec.yml"

          # Verify hook paths are present in appspec.yml.
          grep -q 'beforeInstall' "$PACKAGE_DIR/appspec.yml"
          grep -q 'applicationStart' "$PACKAGE_DIR/appspec.yml"

          (
            cd "$PACKAGE_DIR"
            zip -qr "$ARTIFACT_PATH" .
          )

          test -s "$ARTIFACT_PATH"

          echo "Deployment artifact created:"
          ls -lh "$ARTIFACT_PATH"

      # ============================================================
      # 12. Upload artifact to DEV S3
      # ============================================================
      - name: Upload artifact to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_DEV }}
          ARTIFACT_NAME: ${{ steps.artifact_name.outputs.unique_name }}
        run: |
          set -euo pipefail

          ARTIFACT_KEY="${ARTIFACT_PREFIX}/${ARTIFACT_NAME}.zip"

          aws s3 cp \
            "$GITHUB_WORKSPACE/${ARTIFACT_NAME}.zip" \
            "s3://${S3_BUCKET}/${ARTIFACT_KEY}" \
            --region "$AWS_REGION"

          echo "Artifact uploaded successfully"
          echo "S3 key: $ARTIFACT_KEY"

      # ============================================================
      # 13. Create CodeDeploy deployment
      # ============================================================
      - name: Create CodeDeploy deployment
        id: deploy
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_DEV }}
          ARTIFACT_NAME: ${{ steps.artifact_name.outputs.unique_name }}
        run: |
          set -euo pipefail

          ARTIFACT_KEY="${ARTIFACT_PREFIX}/${ARTIFACT_NAME}.zip"

          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APPLICATION" \
            --deployment-group-name "$CODEDEPLOY_DEPLOYMENT_GROUP" \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --s3-location \
              "bucket=${S3_BUCKET},key=${ARTIFACT_KEY},bundleType=zip" \
            --region "$AWS_REGION" \
            --query 'deploymentId' \
            --output text)

          test -n "$DEPLOYMENT_ID"
          test "$DEPLOYMENT_ID" != "None"

          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

          echo "CodeDeploy Deployment ID: $DEPLOYMENT_ID"

      # ============================================================
      # 14. Wait for CodeDeploy to complete
      # ============================================================
      - name: Wait for deployment
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail

          echo "Waiting for CodeDeploy deployment..."

          if ! aws deploy wait deployment-successful \
            --deployment-id "$DEPLOYMENT_ID" \
            --region "$AWS_REGION"; then

            echo "ERROR: Deployment did not complete successfully"

            aws deploy get-deployment \
              --deployment-id "$DEPLOYMENT_ID" \
              --region "$AWS_REGION" \
              --query 'deploymentInfo.{Status:status,Error:errorInformation,Overview:deploymentOverview}' \
              --output json || true

            exit 1
          fi

          echo "Deployment completed successfully"

      # ============================================================
      # 15. Cleanup sensitive files and build artifacts
      # ============================================================
      - name: Cleanup
        if: always()
        env:
          ARTIFACT_NAME: ${{ steps.artifact_name.outputs.unique_name }}
        run: |
          set +e

          rm -f \
            .env \
            storage/oauth-private.key \
            storage/oauth-public.key \
            "$RUNNER_TEMP/env-dev.json"

          if [ -n "$ARTIFACT_NAME" ]; then
            rm -f "$GITHUB_WORKSPACE/${ARTIFACT_NAME}.zip"
          fi

          rm -rf "$RUNNER_TEMP/marketplace-api-package"

          echo "Cleanup completed"
