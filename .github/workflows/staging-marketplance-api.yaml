name: Marketplace-API-STG Pipeline

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: [ marketplace-api-stg ]
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Restore Laravel Passport OAuth keys
      - name: Restore Passport OAuth keys
        env:
          PASSPORT_PRIVATE_KEY: ${{ secrets.PASSPORT_PRIVATE_KEY }}
          PASSPORT_PUBLIC_KEY: ${{ secrets.PASSPORT_PUBLIC_KEY }}
        run: |
          mkdir -p storage

          printf '%s\n' "$PASSPORT_PRIVATE_KEY" > storage/oauth-private.key
          printf '%s\n' "$PASSPORT_PUBLIC_KEY" > storage/oauth-public.key

          chmod 600 storage/oauth-private.key
          chmod 600 storage/oauth-public.key

          echo "Passport OAuth keys restored"

      # Create .env BEFORE tests
      - name: Create .env file from JSON secret
        env:
          ENV_JSON: ${{ secrets.ENV_STAGING }}
        run: |
          echo "$ENV_JSON" > config.json
          jq -r 'to_entries | .[] | "\(.key)=\(.value)"' config.json > .env
          rm -f config.json

      # Install dependencies
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      # Run tests
      # APP_KEY_STAGING is explicitly supplied to Laravel during tests
      - name: Run tests
        env:
          APP_KEY: ${{ secrets.APP_KEY_STAGING }}
        run: composer test

      # Remove test dependencies from deploy artifact
      - name: Remove test dependencies from deploy artifact
        run: rm -rf vendor

      - name: Generate unique artifact name
        id: artifact_name
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          COMMIT_SHA_SHORT=$(git rev-parse --short HEAD)
          UNIQUE_NAME="artifact_${TIMESTAMP}_${COMMIT_SHA_SHORT}"
          echo "unique_name=$UNIQUE_NAME" >> $GITHUB_OUTPUT
          echo "Artifact name: $UNIQUE_NAME"

      - name: Create zip artifact
        run: |
          aws s3 cp s3://${{ secrets.S3_BUCKET_staging }}/binaries/staging/marketplace-api-stg/appspec.yml .
          aws s3 cp s3://${{ secrets.S3_BUCKET_staging }}/binaries/staging/marketplace-api-stg/beforeInstall .
          aws s3 cp s3://${{ secrets.S3_BUCKET_staging }}/binaries/staging/marketplace-api-stg/applicationStart .

          zip -r ${{ steps.artifact_name.outputs.unique_name }}.zip . \
            -x "*.git*" "*.github*"

      - name: Upload to S3
        run: |
          aws s3 cp \
            ${{ steps.artifact_name.outputs.unique_name }}.zip \
            s3://${{ secrets.S3_BUCKET_staging }}/staging/marketplace-api-stg/

      - name: Create Marketplace CodeDeploy deployment
        id: deploy_marketplace
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name marketplace-api-stg \
            --deployment-group-name marketplace-api-stg-dg \
            --s3-location bucket=${{ secrets.S3_BUCKET_staging }},key=staging/marketplace-api-stg/${{ steps.artifact_name.outputs.unique_name }}.zip,bundleType=zip \
            --region us-east-1 \
            --description "Marketplace API STG deployment from GitHub Actions run $GITHUB_RUN_ID" \
            --query 'deploymentId' \
            --output text)

          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT

      - name: Wait for Marketplace deployment
        run: |
          DEPLOYMENT_ID="${{ steps.deploy_marketplace.outputs.deployment_id }}"

          echo "Waiting for marketplace deployment: $DEPLOYMENT_ID"

          set +e

          aws deploy wait deployment-successful \
            --deployment-id $DEPLOYMENT_ID \
            --region us-east-1

          WAIT_EXIT_CODE=$?

          set -e

          if [ $WAIT_EXIT_CODE -eq 0 ]; then
            echo "Marketplace deployment completed successfully!"
          else
            aws deploy get-deployment \
              --deployment-id $DEPLOYMENT_ID \
              --region us-east-1 \
              --output json | jq -r \
              '.deploymentInfo | "Status: \(.status)\nError Code: \(.errorInformation.code)\nError Message: \(.errorInformation.message)"'

            exit 1
          fi

      - name: Clean up
        run: |
          rm -f ${{ steps.artifact_name.outputs.unique_name }}.zip
          rm -f storage/oauth-private.key
          rm -f storage/oauth-public.key
